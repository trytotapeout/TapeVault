# 检查 PR 里每个提交都带 DCO 签名：Signed-off-by: 姓名 <邮箱>，邮箱与提交作者一致。
# 用 git commit -s 提交即可自动加上。只读 API，不检出、不执行 PR 里的代码。
name: DCO

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  pull-requests: read
  contents: read

jobs:
  dco:
    runs-on: ubuntu-latest
    steps:
      - name: Check Signed-off-by
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/$REPO/pulls/$PR/commits" \
            --jq '.[] | [.sha, (.commit.author.email | ascii_downcase), (.parents | length), (.commit.message | @base64)] | @tsv' > commits.tsv
          bad=0
          while IFS=$'\t' read -r sha email parents msg; do
            [ "$parents" -gt 1 ] && continue   # 合并提交不检查
            # 取出所有 Signed-off-by 里的邮箱，按整行精确比较（不区分大小写）
            signers=$(printf '%s' "$msg" | base64 -d | tr 'A-Z' 'a-z' | sed -nE 's/^signed-off-by: .+ <([^>]+)>[[:space:]]*$/\1/p')
            if ! printf '%s\n' "$signers" | grep -qxF -- "$email"; then
              echo "::error::${sha:0:7} 缺少与作者邮箱 <$email> 一致的 Signed-off-by"
              bad=1
            fi
          done < commits.tsv
          if [ "$bad" = 1 ]; then
            echo "修复方法：git rebase --signoff origin/main && git push --force-with-lease"
            exit 1
          fi
          echo "所有提交都带有 DCO 签名"
